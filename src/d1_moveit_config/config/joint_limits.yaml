# Velocities from the URDF; MoveIt also needs accelerations for time
# parameterisation. Scaled down by default: this arm rides on a walking robot.
default_velocity_scaling_factor: 0.3
default_acceleration_scaling_factor: 0.3
joint_limits:
  Joint1: {has_velocity_limits: true, max_velocity: 1.05, has_acceleration_limits: true, max_acceleration: 2.0}
  Joint2: {has_velocity_limits: true, max_velocity: 1.05, has_acceleration_limits: true, max_acceleration: 2.0}
  Joint3: {has_velocity_limits: true, max_velocity: 1.05, has_acceleration_limits: true, max_acceleration: 2.0}
  Joint4: {has_velocity_limits: true, max_velocity: 1.73, has_acceleration_limits: true, max_acceleration: 3.0}
  Joint5: {has_velocity_limits: true, max_velocity: 1.73, has_acceleration_limits: true, max_acceleration: 3.0}
  Joint6: {has_velocity_limits: true, max_velocity: 1.73, has_acceleration_limits: true, max_acceleration: 3.0}
  Joint_L: {has_velocity_limits: true, max_velocity: 0.02, has_acceleration_limits: true, max_acceleration: 0.1}
  Joint_R: {has_velocity_limits: true, max_velocity: 0.02, has_acceleration_limits: true, max_acceleration: 0.1}
