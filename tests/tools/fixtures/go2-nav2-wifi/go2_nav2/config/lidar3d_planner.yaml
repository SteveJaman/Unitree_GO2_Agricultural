global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: lidar3d_map
      robot_base_frame: base_link
      transform_tolerance: 1.0
      update_frequency: 4.0
      publish_frequency: 2.0
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.1
      track_unknown_space: true
      robot_radius: 0.22
      plugins:
      - obstacle_layer
      - height_band_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: lidar yolo
        yolo:
          topic: /yolo/obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 6.0
          expected_update_rate: 0.0
        lidar:
          topic: /lidar3d/registered
          sensor_frame: lidar3d_sensor
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.15
          max_obstacle_height: 1.6
          obstacle_min_range: 0.35
          obstacle_max_range: 12.0
          raytrace_min_range: 0.35
          raytrace_max_range: 12.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.3
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
      height_band_layer:
        plugin: semantic_traversability_layer/HeightBandLayer
        enabled: true
        topic: /lidar3d/obstacle_points
        ground_z: 0.0
        ground_tolerance: 0.02
        step_over_height_max: 0.15
        lethal_height_min: 0.25
        max_range: 5.0
        step_over_cost: 40
        caution_cost: 200
