# Global planning for the traversability trials. Same for both modes: the
# plugins stay out of the global costmap. Values follow go2-nav2-wifi's
# lidar3d_planning.launch.py with GO2_LIDAR3D_NAV=1.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerLattice
      lattice_filepath: /opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json
      allow_unknown: true
      allow_reverse_expansion: false
      tolerance: 0.25
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      smooth_path: false
      cache_obstacle_heuristic: false
      rotation_penalty: 5.0
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: lidar3d_map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      update_frequency: 4.0
      publish_frequency: 2.0
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.360,0.200],[0.360,-0.200],[-0.450,-0.200],[-0.450,0.200]]"
      footprint_padding: 0.03
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: lidar
        lidar:
          topic: /lidar3d/obstacle_points
          sensor_frame: lidar3d_sensor
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.15
          max_obstacle_height: 1.6
          obstacle_min_range: 0.35
          obstacle_max_range: 12.0
          raytrace_min_range: 0.35
          raytrace_max_range: 12.0
          observation_persistence: 0.0
          expected_update_rate: 0.8
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
