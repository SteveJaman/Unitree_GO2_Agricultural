# Omnidirectional navigation for the Go2 (wifi_nav.sh / wifi_3d_nav.sh --omni).
#
# The default go2-nav2-wifi setup treats the dog like a two-wheeled robot:
# forward-only lattice arcs, Regulated Pure Pursuit that never reverses, and a
# smoother that clamps sideways speed to 0. This file lets it use what a
# quadruped can do: walk backwards, sidestep, and turn on the spot, all mixed.
#
# Copied to go2-nav2-wifi go2_nav2/config/go2_omni.yaml by
# scripts/tools/nav2_omni.py; the hooks it adds to lidar3d_planning.launch.py
# and lidar3d_controller.launch.py read it when the file exists.

# Planner (Smac State Lattice): omnidirectional motion primitives, so plans may
# contain sideways and backward moves.
planner:
  lattice_filepath: /opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/omni/output.json
  allow_reverse_expansion: true
  rotation_penalty: 2.0

# Controller: MPPI with the Omni motion model (vx, vy, wz). It samples
# batch_size trajectories over a time_steps x model_dt horizon and scores them
# with the critics below; CostCritic checks the footprint against the costmap.
controller:
  FollowPath:
    plugin: nav2_mppi_controller::MPPIController
    motion_model: Omni
    time_steps: 40          # x model_dt = 4 s horizon
    model_dt: 0.1           # = 1 / controller_frequency (10 Hz)
    batch_size: 1000
    iteration_count: 1
    vx_std: 0.2
    vy_std: 0.15
    wz_std: 0.4
    vx_max: 0.30
    vx_min: -0.20           # walks backwards
    vy_max: 0.20            # sidesteps
    wz_max: 0.70
    temperature: 0.3
    gamma: 0.015
    prune_distance: 1.7
    transform_tolerance: 0.3
    reset_period: 1.0
    regenerate_noises: false
    visualize: false
    TrajectoryVisualizer:
      trajectory_step: 5
      time_step: 3
    critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic,
              PathFollowCritic, PathAngleCritic, PreferForwardCritic, TwirlingCritic]
    ConstraintCritic:
      enabled: true
      cost_power: 1
      cost_weight: 4.0
    CostCritic:
      enabled: true
      cost_power: 1
      cost_weight: 3.81
      critical_cost: 300.0
      consider_footprint: true
      collision_cost: 1000000.0
      near_goal_distance: 1.0
      trajectory_point_step: 2
    GoalCritic:
      enabled: true
      cost_power: 1
      cost_weight: 5.0
      threshold_to_consider: 1.4
    GoalAngleCritic:
      enabled: true
      cost_power: 1
      cost_weight: 3.0
      threshold_to_consider: 0.5
    PathAlignCritic:
      enabled: true
      cost_power: 1
      cost_weight: 14.0
      max_path_occupancy_ratio: 0.05
      trajectory_point_step: 4
      threshold_to_consider: 0.5
      offset_from_furthest: 20
      use_path_orientations: false
    PathFollowCritic:
      enabled: true
      cost_power: 1
      cost_weight: 5.0
      offset_from_furthest: 5
      threshold_to_consider: 1.4
    PathAngleCritic:
      enabled: true
      cost_power: 1
      cost_weight: 2.0
      offset_from_furthest: 4
      threshold_to_consider: 0.5
      max_angle_to_furthest: 1.0
      forward_preference: false   # backing along the path is allowed
    PreferForwardCritic:
      enabled: true
      cost_power: 1
      cost_weight: 2.0            # weak: forward when free, reverse when it helps
      threshold_to_consider: 0.5
    TwirlingCritic:
      enabled: true
      cost_power: 1
      cost_weight: 10.0

# Velocity smoother (only it publishes /cmd_vel): allow sideways and reverse.
smoother:
  max_velocity: [0.30, 0.20, 0.70]
  min_velocity: [-0.20, -0.20, -0.70]
  max_accel: [0.5, 0.4, 0.8]
  max_decel: [-0.5, -0.4, -0.8]
  deadband_velocity: [0.03, 0.03, 0.08]
